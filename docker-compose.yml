name: ${COMPOSE_PROJECT_NAME:-sorabase}
services:
  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER:-sorabase-postgres}
    entrypoint: ["sh", "/usr/local/bin/sorabase-entrypoint.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env or pass --env-file Backend/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - unix_socket_directories=/var/run/postgresql
      - -c
      - unix_socket_permissions=0777
      # Duration-only JSON logs: never log successful SQL text or bind values.
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/sorabase-activity
      - -c
      - log_filename=activity-%Y%m%d-%H%M%S.log
      - -c
      - log_rotation_age=1min
      - -c
      - log_rotation_size=4MB
      - -c
      - log_file_mode=0600
      - -c
      - log_duration=on
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    tmpfs:
      # Transient operational logs only; no raw error text in persistent volumes.
      - /var/log/sorabase-activity:size=67108864,mode=0700
    ports:
      - "0.0.0.0:${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
      - ./Backend/backups:/var/lib/sorabase/backups
      # Read-only upgrade source; old archives are copied without deletion.
      - postgres-backups:/var/lib/sorabase/legacy-backups:ro
      - ./docker/postgres/entrypoint.sh:/usr/local/bin/sorabase-entrypoint.sh:ro
      - ./docker/postgres/network-policy.sh:/usr/local/bin/sorabase-network-policy.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [sorabase]

  pgbouncer:
    build: ./docker/pgbouncer
    environment:
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "0.0.0.0:${PGBOUNCER_PUBLIC_PORT:-6432}:6432"
    volumes:
      - postgres-socket:/var/run/postgresql
      - pooler-config:/etc/pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [sorabase]

  studio:
    build:
      context: .
      dockerfile: Backend/dockerfile
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      LEGACY_CONTROL_DB: ${LEGACY_CONTROL_DB:-${CONTROL_DB:-sorabase_control}}
      DATABASE_PUBLIC_HOST: ${DATABASE_PUBLIC_HOST:-}
      POSTGRES_PUBLIC_PORT: ${POSTGRES_PUBLIC_PORT:-5432}
      PGBOUNCER_PUBLIC_PORT: ${PGBOUNCER_PUBLIC_PORT:-6432}
      ADMIN_DATA_DIR: /app/Backend/data
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTO_START_COMPOSE: "false"
      PORT: "8000"
      DOCKER_SOCKET: /var/run/docker.sock
      PG_SOCKET_DIR: /var/run/postgresql
      POSTGRES_CONTAINER: ${POSTGRES_CONTAINER:-sorabase-postgres}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-30000}
      POSTGRES_ACTIVITY_LOGS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - postgres-socket:/var/run/postgresql
      - ./Backend/data:/app/Backend/data
      - admin-socket:/var/run/sorabase
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [sorabase]

  frontend:
    build:
      context: .
      dockerfile: Frontend/dockerfile
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET:?Set a new SESSION_SECRET of at least 32 characters}
      ADMIN_SOCKET_PATH: /var/run/sorabase/admin.sock
      STUDIO_COOKIE_SECURE: ${STUDIO_COOKIE_SECURE:-false}
    volumes:
      - admin-socket:/var/run/sorabase
    ports:
      - "0.0.0.0:${STUDIO_PORT:-5000}:5000"
    depends_on:
      studio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [sorabase]

networks:
  sorabase:
    driver: bridge
volumes:
  postgres-data:
  postgres-socket:
  postgres-backups:
  admin-socket:
  pooler-config:
